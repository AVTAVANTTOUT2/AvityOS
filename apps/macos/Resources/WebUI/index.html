<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>AvityOS</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        background: #F7F4EE;
        color: #202124;
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      .card {
        max-width: 28rem;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 1.25rem;
        padding: 1.5rem;
        box-shadow: 0 20px 80px rgba(32, 33, 36, 0.08);
      }
      code { font-size: 0.85em; }
    </style>
  </head>
  <body>
    <main data-testid="webui-placeholder">
      <div class="card">
        <h1>Front Figma non empaqueté</h1>
        <p>
          Générez l’interface Mission Control avant de lancer l’app&nbsp;:
        </p>
        <p><code>./scripts/build-macos-webui.sh</code></p>
      </div>
    </main>
  </body>
</html>
